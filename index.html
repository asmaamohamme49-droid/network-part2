function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function makeOptions(correct, pool, n=3){
  const opts = [correct];
  const uniq = [...new Set(pool.filter(x => x !== correct))];
  const sh = shuffle(uniq);
  for(let i=0; i<sh.length && opts.length < n+1; i++) opts.push(sh[i]);
  return shuffle(opts);
}

const allFacts = parts.flatMap(p => p.facts.map(f => ({...f, partId:p.id, partTitle:p.title})));
const partById = id => parts.find(p => p.id === id);
const factsFor = id => id === "final" ? allFacts : (partById(id) ? partById(id).facts : []);
const titleFor = id => {
  if(id === "final") return "Final Chapter Revision";
  const p = partById(id);
  return p ? p.title : "";
};

/* ================= Progress helpers ================= */
function lessonKey(partId, i){ return partId + ":" + i; }
function cardKey(partId, i){ return partId + ":" + i; }
function countLessons(part){
  return part.lessons.filter((_, i) => progress.lessons[lessonKey(part.id, i)]).length;
}
function countCards(part){
  return part.facts.filter((_, i) => progress.cards[cardKey(part.id, i)]).length;
}
function partPercent(part){
  if(!part) return 0;
  const l = part.lessons.length ? (countLessons(part) / part.lessons.length) * 30 : 0;
  const c = part.facts.length ? (countCards(part) / part.facts.length) * 20 : 0;
  const e = progress.exams[part.id] ? progress.exams[part.id].percent * 0.5 : 0;
  return Math.min(100, Math.round(l + c + e));
}
function statusOf(part){
  const p = partPercent(part);
  if(p >= 100) return "Completed";
  if(p > 0) return "In Progress";
  return "Not Started";
}
function overallPercent(){
  if(!parts.length) return 0;
  return Math.round(parts.reduce((s, p) => s + partPercent(p), 0) / parts.length);
}

        <div style="min-width:220px">
          <div class="small row space"><span>التقدم الكلي</span><b>${overallPercent()}%</b></div>
          <div class="progress"><div style="width:${overallPercent()}%"></div></div>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button onclick="continueLearning()">Continue Learning</button>
        <button class="secondary" onclick="showFinal()">Final Chapter Revision</button>
      </div>
      <p class="small muted">${cont}</p>
    </section>
    <div class="grid">
      ${parts.map(p => {
        const exam = progress.exams[p.id];
        return `
        <div class="card part-card">
          <h3>${p.title}</h3>
          <p class="small muted">${p.desc}</p>
          <div class="small row space"><span>الإنجاز</span><b>${partPercent(p)}%</b></div>
          <div class="progress"><div style="width:${partPercent(p)}%"></div></div>
          <p class="small">الدروس: ${countLessons(p)} / ${p.lessons.length} &nbsp; | &nbsp; Flashcards: ${countCards(p)} / ${p.facts.length}</p>
          <p class="small">الاختبار: ${exam ? exam.score + " / " + exam.total + " (" + exam.percent + "%)" : "لم يتم"}</p>
          <p class="small">الحالة: <b>${statusOf(p)}</b></p>
          <div class="row">
            <button onclick="showPart('${p.id}','study')">فتح الجزء</button>
            <button class="secondary" onclick="showPart('${p.id}','exam')">الاختبار</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function continueLearning(){
  if(progress.last && progress.last.part === "final"){ showFinal(); return; }
  if(progress.last && partById(progress.last.part)){
    showPart(progress.last.part, progress.last.stage || "study");
    return;
  }
  showPart("part1", "study");
}

/* ================= Part view ================= */
function showPart(partId, stage){
  if(!partById(partId)){ showPart("part1","study"); return; }
  if(currentPartId !== partId){ currentLessonIndex = 0; }
  currentPartId = partId;
  currentStage = stage || "study";
  flashState = { partId, index:0, show:false };
  progress.last = {part:partId, stage:currentStage};
  saveProgress();
  renderPart();
}

function renderPart(){
  const p = partById(currentPartId);
  if(!p){ showPart("part1","study"); return; }
  app.innerHTML = `
    <section class="card">
      <div class="row space">
        <div>
          <h2 style="margin:0;color:var(--navy)">${p.title}</h2>
        </div>
        <button class="secondary" onclick="goHome()">رجوع للرئيسية</button>
      </div>
      <p class="muted">${p.desc}</p>
      <div class="progress"><div style="width:${partPercent(p)}%"></div></div>
      <div class="tabs" style="margin-top:14px">
        ${tabBtn("study","Study & Explanation")}
        ${tabBtn("flash","20 Essay Flashcards")}
        ${tabBtn("summary","20 Key Points")}
        ${tabBtn("exam","Final Exam – 60 Questions")}
        ${tabBtn("results","Part Results")}
      </div>
    </section>
    <section id="stage"></section>
  `;
  renderStage();
}

function tabBtn(stage, label){
  return `<button class="${currentStage===stage?'':'secondary'}" onclick="setStage('${stage}')">${label}</button>`;
}

function setStage(stage){
  currentStage = stage;
  progress.last = {part:currentPartId, stage};
  saveProgress();
  renderPart();
}

function renderStage(){
  const box = document.getElementById("stage");
  if(!box) return;
  if(currentStage === "study") box.innerHTML = studyHTML();
  else if(currentStage === "flash") box.innerHTML = flashHTML();
  else if(currentStage === "summary") box.innerHTML = summaryHTML();
  else if(currentStage === "exam") box.innerHTML = examIntroHTML();
  else if(currentStage === "results") box.innerHTML = resultsHTML(currentPartId);
  else box.innerHTML = studyHTML();
}

/* ================= Study ================= */
function studyHTML(){
  const p = partById(currentPartId);
  if(!p) return "";
  if(currentLessonIndex >= p.lessons.length) currentLessonIndex = 0;
  const lesson = p.lessons[currentLessonIndex];
  const done = !!progress.lessons[lessonKey(p.id, currentLessonIndex)];
  return `
  <div class="card">
    <div class="row space">
      <h3 style="margin:0;color:var(--navy)">${lesson.title}</h3>
      <span class="badge">Lesson ${currentLessonIndex+1} / ${p.lessons.length}</span>
    </div>
    <div class="lesson-box"><h4>Original Text</h4><p class="en">${lesson.en}</p></div>
    <div class="lesson-box"><h4>الترجمة العربية</h4><p>${lesson.ar}</p></div>
    <div class="lesson-box"><h4>شرح مبسط بالمصري</h4><p>${lesson.explain}</p></div>
    <div class="lesson-box"><h4>المصطلحات</h4>${lesson.terms.map(t => `<span class="tag">${t.en} = ${t.ar}</span>`).join("")}</div>
    <div class="lesson-box"><h4>الأهمية</h4><p>${lesson.importance}</p></div>
    <div class="lesson-box"><h4>مثال عملي</h4><p>${lesson.example}</p></div>
    <div class="lesson-box"><h4>الفروق المهمة</h4><p>${lesson.difference}</p></div>
    <div class="lesson-box"><h4>شرح الرسم / المخطط</h4><p>${lesson.diagram}</p></div>
    <div class="lesson-box"><h4>مهم للامتحان</h4><p>${lesson.exam}</p></div>
    <div class="row space" style="margin-top:16px">
      <button class="secondary" ${currentLessonIndex===0?'disabled':''} onclick="prevLesson()">Previous Lesson</button>
      <button class="${done?'good':'warn'}" onclick="toggleLessonDone()">${done?'Completed ✓':'Mark as Completed'}</button>
      <button ${currentLessonIndex===p.lessons.length-1?'disabled':''} onclick="nextLesson()">Next Lesson</button>
    </div>
  </div>`;
}
function prevLesson(){ if(currentLessonIndex>0){ currentLessonIndex--; renderStage(); } }
function nextLesson(){
  const p = partById(currentPartId);
  if(p && currentLessonIndex < p.lessons.length-1){ currentLessonIndex++; renderStage(); }
}
function toggleLessonDone(){
  const key = lessonKey(currentPartId, currentLessonIndex);
  progress.lessons[key] = !progress.lessons[key];
  saveProgress(); renderStage();
}

/* ================= Flashcards ================= */
function flashHTML(){
  const partId = flashState.partId || currentPartId;
  const facts = factsFor(partId);
  if(!facts.length) return `<div class="card"><p>لا توجد بطاقات.</p></div>`;
  if(flashState.index >= facts.length) flashState.index = 0;
  const idx = flashState.index;
  const f = facts[idx];
  const reviewed = !!progress.cards[cardKey(partId, idx)];
  return `
  <div class="card flashcard">
    <div class="row space">
      <span class="badge">Card ${idx+1} / ${facts.length}</span>
      <span class="badge">${reviewed ? "Reviewed ✓" : "Not reviewed"}</span>
    </div>
    <div class="q en">Explain / Define: ${f.topic}</div>
    ${flashState.show ? `
      <div class="lesson-box">
        <h4>Model Answer</h4>
        <p class="en">${f.en}</p>
        <h4>الترجمة</h4>
        <p>${f.ar}</p>
      </div>
    ` : `<p class="muted">اضغط Show Answer لإظهار الإجابة النموذجية.</p>`}
    <div class="row space" style="margin-top:16px">
      <button class="secondary" ${idx===0?'disabled':''} onclick="prevCard()">Previous Card</button>
      <button onclick="toggleCardAnswer()">${flashState.show?'Hide Answer':'Show Answer'}</button>
      <button ${idx===facts.length-1?'disabled':''} onclick="nextCard()">Next Card</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" onclick="shuffleCards()">Shuffle Cards</button>
      <button class="${reviewed?'good':'secondary'}" onclick="toggleCardReviewed()">${reviewed?'Reviewed ✓':'Mark as Reviewed'}</button>
    </div>
  </div>`;
}
function toggleCardAnswer(){ flashState.show = !flashState.show; renderStage(); }
function prevCard(){ if(flashState.index>0){ flashState.index--; flashState.show=false; renderStage(); } }
function nextCard(){ const facts = factsFor(flashState.partId||currentPartId); if(flashState.index<facts.length-1){ flashState.index++; flashState.show=false; renderStage(); } }
function shuffleCards(){ const facts = factsFor(flashState.partId||currentPartId); flashState.index = Math.floor(Math.random()*facts.length); flashState.show=false; renderStage(); }
function toggleCardReviewed(){
  const partId = flashState.partId || currentPartId;
  const key = cardKey(partId, flashState.index);
  progress.cards[key] = !progress.cards[key];
  saveProgress(); renderStage();
}

/* ================= Summary ================= */
function summaryHTML(){
  const facts = factsFor(currentPartId);
  return `
  <div class="card">
    <h3 style="color:var(--navy)">20 Key Points – ${titleFor(currentPartId)}</h3>
    ${facts.map((f,i)=>`
      <div class="list-item">
        <div class="check">
          <input type="checkbox" ${progress.important[cardKey(currentPartId,i)]?'checked':''} onchange="toggleImportant(${i})">
          <div>
            <div><b>${i+1}.</b> <span class="en">${f.en}</span></div>
            <div class="muted small">${f.ar}</div>
          </div>
        </div>
      </div>
    `).join("")}
  </div>`;
}
function toggleImportant(i){
  const key = cardKey(currentPartId, i);
  progress.important[key] = !progress.important[key];
  saveProgress();
}

/* ================= Exam ================= */
function buildPartExam(part){
  if(!part) return [];
  const qs = [];
  part.facts.forEach((f, i) => {
    const pool1 = part.facts.filter(x => x !== f).map(x => x.en);
    const opts1 = makeOptions(f.en, pool1);
    qs.push({
      type:"mcq",
      q:`Which statement is correct about ${f.topic}?`,
      options:opts1,
      answer:opts1.indexOf(f.en),
      explanation:f.en,
      arQ:`أي عبارة صحيحة عن ${f.topic}؟`,
      arExp:f.ar,
      topic:f.topic,
      difficulty:f.diff
    });
    const other = part.facts[(i+1) % part.facts.length];
    qs.push({
      type:"tf",
      q:`True or False: "${other.en}" describes ${f.topic}.`,
      options:["True","False"],
      answer:1,
      explanation:`False. ${f.en}`,
      arQ:`صح أم خطأ: "${other.ar}" تصف ${f.topic}؟`,
      arExp:`خطأ. ${f.ar}`,
      topic:f.topic,
      difficulty:f.diff
    });
    const pool3 = part.facts.filter(x => x.topic !== f.topic).map(x => x.topic);
    const opts3 = makeOptions(f.topic, pool3);
    qs.push({
      type:"mcq",
      q:`Which term matches this description: ${f.en}`,
      options:opts3,
      answer:opts3.indexOf(f.topic),
      explanation:f.en,
      arQ:`أي مصطلح يطابق هذا الوصف: ${f.ar}`,
      arExp:f.ar,
      topic:f.topic,
      difficulty:f.diff
    });
  });
  return qs.slice(0,60);
}

function buildFinalExam(){
  return allFacts.map(f => {
    const opts = makeOptions(f.en, allFacts.filter(x => x !== f).map(x => x.en));
    return {
      type:"mcq",
      q:`Which statement is correct about ${f.topic}?`,
      options:opts,
      answer:opts.indexOf(f.en),
      explanation:f.en,
      arQ:`أي عبارة صحيحة عن ${f.topic}؟`,
      arExp:f.ar,
      topic:f.topic,
      difficulty:f.diff
    };
  }).slice(0,60);
}

function examIntroHTML(){
  return `
  <div class="card">
    <h3 style="color:var(--navy)">Final Exam – ${titleFor(currentPartId)}</h3>
    <p>الاختبار مكون من 60 سؤالًا. سؤال واحد في كل مرة. بعد اختيار الإجابة اضغط Confirm Answer.</p>
    <button onclick="startExam('${currentPartId}')">Start Exam</button>
  </div>`;
}

function startExam(partId){
  let qs = [];
  if(partId === "final") qs = buildFinalExam();
  else qs = buildPartExam(partById(partId));
  if(!qs.length){ alert("لا توجد أسئلة متاحة."); return; }
  examState = { partId, questions:qs, index:0, selected:null, confirmed:false, score:0, wrong:[] };
  renderExamQuestion();
}

function renderExamQuestion(){
  if(!examState) { renderDashboard(); return; }
  const q = examState.questions[examState.index];
  const total = examState.questions.length;
  app.innerHTML = `
    <div class="card">
      <div class="row space">
        <span class="badge">Question ${examState.index+1} / ${total}</span>
        <span class="badge">${q.difficulty||""}</span>
      </div>
      <h3 class="en">${q.q}</h3>
      <p class="muted small">${q.arQ}</p>
      <div>
        ${q.options.map((opt,i)=>{
          let cls = "option";
          if(examState.selected === i && !examState.confirmed) cls += " selected";
          if(examState.confirmed && i === q.answer) cls += " correct";
          if(examState.confirmed && examState.selected === i && i !== q.answer) cls += " wrong";
          return `<button class="${cls}" ${examState.confirmed?'disabled':''} onclick="selectOption(${i})">${opt}</button>`;
        }).join("")}
      </div>
      ${examState.confirmed ? `
        <div class="lesson-box">
          <p><b>${examState.selected === q.answer ? "Correct ✓" : "Wrong ✗"}</b></p>
          <p class="en"><b>Explanation:</b> ${q.explanation}</p>
          <p><b>الترجمة:</b> ${q.arExp}</p>
        </div>
        <button onclick="nextExamQuestion()">${examState.index === total-1 ? "Show Results" : "Next Question"}</button>
      ` : `
        <button onclick="confirmExamAnswer()">Confirm Answer</button>
      `}
    </div>
  `;
}

function selectOption(i){
  if(!examState || examState.confirmed) return;
  examState.selected = i;
  renderExamQuestion();
}

function confirmExamAnswer(){
  if(!examState || examState.selected === null || examState.confirmed) return;
  const q = examState.questions[examState.index];
  examState.confirmed = true;
  if(examState.selected === q.answer) examState.score++;
  else {
    examState.wrong.push({
      q:q.q, correct:q.options[q.answer], your:q.options[examState.selected],
      explanation:q.explanation, arExp:q.arExp, topic:q.topic
    });
    progress.wrong.push({partId:examState.partId, ...q});
    saveProgress();
  }
  renderExamQuestion();
}

function nextExamQuestion(){
  if(!examState) return;
  if(examState.index < examState.questions.length-1){
    examState.index++;
    examState.selected = null;
    examState.confirmed = false;
    renderExamQuestion();
  } else finishExam();
}

function finishExam(){
  if(!examState) return;
  const total = examState.questions.length;
  const percent = Math.round(examState.score / total * 100);
  const result = { score:examState.score, total, percent, date:new Date().toISOString(), wrong:examState.wrong };
  progress.exams[examState.partId] = result;
  const partId = examState.partId;
  examState = null;
  saveProgress();
  if(partId === "final"){ showFinalResults(); }
  else { currentPartId = partId; currentStage = "results"; progress.last = {part:partId, stage:"results"}; saveProgress(); renderPart(); }
}

function resultsHTML(partId){
  const r = progress.exams[partId];
  if(!r) return `<div class="card"><h3>Part Results</h3><p>لم يتم أداء الاختبار بعد.</p></div>`;
  const level = r.percent >= 85 ? "Excellent" : r.percent >= 70 ? "Good" : r.percent >= 50 ? "Needs Review" : "Weak";
  return `
  <div class="card">
    <h3 style="color:var(--navy)">Part Results – ${titleFor(partId)}</h3>
    <p class="score">${r.score} / ${r.total}</p>
    <p>Percentage: <b>${r.percent}%</b></p>
    <p>Correct: <b>${r.score}</b> &nbsp; | &nbsp; Wrong: <b>${r.wrong.length}</b></p>
    <p>Performance Level: <b>${level}</b></p>
    <h4>الموضوعات التي تحتاج مراجعة</h4>
    <p>${[...new Set(r.wrong.map(w=>w.topic))].join(", ") || "لا توجد"}</p>
    <div class="row">
      <button class="secondary" onclick="toggleWrongReview()">Review Wrong Answers</button>
      <button onclick="startExam('${partId}')">Retake Exam</button>
      ${partId !== "final" ? `<button onclick="nextPart('${partId}')">Continue to Next Part</button>` : ""}
    </div>
    <div id="wrongReview" style="display:none;margin-top:14px">
      ${r.wrong.map((w,i)=>`
        <div class="list-item">
          <b>${i+1}. ${w.q}</b>
          <p class="small">Correct: ${w.correct}</p>
          <p class="small">Your answer: ${w.your}</p>
          <p class="small en">${w.explanation}</p>
          <p class="small">${w.arExp}</p>
        </div>
      `).join("")}
    </div>
  </div>`;
}

function toggleWrongReview(){
  const el = document.getElementById("wrongReview");
  if(el) el.style.display = el.style.display === "none" ? "block" : "none";
}

function nextPart(partId){
  const order = ["part1","part2","part3"];
  const i = order.indexOf(partId);
  if(i >= 0 && i < order.length-1) showPart(order[i+1], "study");
  else showFinal();
}

/* ================= Final Revision ================= */
function showFinal(){
  currentPartId = "final";
  currentStage = "final";
  progress.last = {part:"final", stage:"final"};
  saveProgress();
  const r = progress.exams.final;
  app.innerHTML = `
    <section class="card">
      <div class="row space">
        <div>
          <h2 style="margin:0;color:var(--navy)">Final Chapter Revision</h2>
          <p class="muted">مراجعة شاملة للفصل بالكامل</p>
        </div>
        <button class="secondary" onclick="goHome()">رجوع للرئيسية</button>
      </div>
      <p>الاختبار النهائي: ${r ? r.score+" / "+r.total+" ("+r.percent+"%)" : "لم يتم"}</p>
      <div class="row">
        <button onclick="showFinalFlashcards()">Review All Flashcards</button>
        <button class="secondary" onclick="showFinalSummary()">Chapter Summary</button>
        <button onclick="startFinalExam()">Final Exam – 60 Questions</button>
      </div>
    </section>
  `;
}

function showFinalFlashcards(){
  flashState = {partId:"final", index:0, show:false};
  app.innerHTML = `<div id="finalFlash"></div>`;
  renderFinalFlashcards();
}

function renderFinalFlashcards(){
  const container = document.getElementById("finalFlash");
  if(!container) return;
  const facts = allFacts;
  if(flashState.index >= facts.length) flashState.index = 0;
  const idx = flashState.index;
  const f = facts[idx];
  const reviewed = !!progress.cards[cardKey("final", idx)];
  container.innerHTML = `
    <div class="card flashcard">
      <div class="row space">
        <span class="badge">Final Flashcard ${idx+1} / ${facts.length}</span>
        <span class="badge">${reviewed?"Reviewed ✓":"Not reviewed"}</span>
      </div>
      <div class="q en">Explain / Define: ${f.topic}</div>
      ${flashState.show ? `<div class="lesson-box"><p class="en">${f.en}</p><p>${f.ar}</p></div>` : `<p class="muted">اضغط Show Answer.</p>`}
      <div class="row space">
        <button class="secondary" ${idx===0?'disabled':''} onclick="finalPrevCard()">Previous</button>
        <button onclick="finalToggleAnswer()">${flashState.show?'Hide Answer':'Show Answer'}</button>
        <button ${idx===facts.length-1?'disabled':''} onclick="finalNextCard()">Next</button>
      </div>
      <div class="row">
        <button class="${reviewed?'good':'secondary'}" onclick="finalToggleReviewed()">${reviewed?'Reviewed ✓':'Mark as Reviewed'}</button>
        <button class="ghost" onclick="showFinal()">رجوع</button>
      </div>
    </div>`;
}
function finalToggleAnswer(){ flashState.show=!flashState.show; renderFinalFlashcards(); }
function finalPrevCard(){ if(flashState.index>0){ flashState.index--; flashState.show=false; renderFinalFlashcards(); } }
function finalNextCard(){ if(flashState.index<allFacts.length-1){ flashState.index++; flashState.show=false; renderFinalFlashcards(); } }
function finalToggleReviewed(){ const key=cardKey("final",flashState.index); progress.cards[key]=!progress.cards[key]; saveProgress(); renderFinalFlashcards(); }

function showFinalSummary(){
  app.innerHTML = `
  <div class="card">
    <div class="row space"><h3 style="color:var(--navy)">Chapter Summary – All Key Points</h3><button class="secondary" onclick="showFinal()">رجوع</button></div>
    ${allFacts.map((f,i)=>`
      <div class="list-item">
        <b>${i+1}.</b> <span class="en">${f.en}</span>
        <div class="muted small">${f.ar}</div>
      </div>
    `).join("")}
  </div>`;
}

function startFinalExam(){
  const qs = buildFinalExam();
  if(!qs.length){ alert("لا توجد أسئلة."); return; }
  examState = { partId:"final", questions:qs, index:0, selected:null, confirmed:false, score:0, wrong:[] };
  renderExamQuestion();
}

function showFinalResults(){
  app.innerHTML = resultsHTML("final");
  progress.last = {part:"final", stage:"results"};
  saveProgress();
}

/* ================= Init ================= */
function init(){
  if(localStorage.getItem("cn_theme") === "dark") document.body.classList.add("dark");
  document.getElementById("themeBtn").textContent = document.body.classList.contains("dark") ? "☀️ Light" : "🌙 Dark";
  renderDashboard();
}
init();
</script>
</body>
</html>
